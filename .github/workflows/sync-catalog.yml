name: Sincronizar catálogo de downloads

on:
  schedule:
    # Horário de Brasília (UTC-3): 00:50, 02:50, 04:50, 06:50, ...
    # Inclui a consulta diária das 06:50 e repete a cada duas horas.
    - cron: '50 1-23/2 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/sync_catalog.py'
      - 'scripts/publish_catalog.py'
      - 'catalogs/**'
      - '.github/workflows/sync-catalog.yml'

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependências do portal
        run: python -m pip install -r requirements.txt
      - name: Testar recuperação e publicação
        run: python -m unittest discover -v
      - name: Descobrir versões sem aguardar os downloads
        timeout-minutes: 8
        run: python -u scripts/sync_catalog.py --catalog-only
      - name: Publicar versões encontradas
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/publish_catalog.py
      - name: Baixar, publicar e confirmar cada espelho
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 35
        run: python -u scripts/sync_catalog.py --publish
      - name: Salvar catálogo confirmado
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/publish_catalog.py

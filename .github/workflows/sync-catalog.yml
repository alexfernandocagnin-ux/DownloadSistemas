name: Sincronizar catálogo de downloads

on:
  schedule:
    # Brasília (UTC-3): 00:50, 02:50, 04:50, 06:50 e a cada duas horas.
    - cron: '50 1-23/2 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/sync_catalog.py'
      - 'scripts/publish_catalog.py'
      - 'catalogs/**'
      - '.github/workflows/sync-catalog.yml'

permissions:
  contents: write
  issues: write

jobs:
  discover:
    name: Consultar e salvar versões
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: sync-catalog-discovery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          # Reaproveita os pacotes baixados; se o cache falhar, só instala do zero.
          cache: pip
      - name: Instalar dependências do portal
        run: python -m pip install -r requirements.txt
      - name: Testar recuperação e publicação
        # Os testes conferem código novo. Nas execuções agendadas só os dados
        # mudam, e um teste afetado pelo catálogo real não pode travar a consulta.
        if: ${{ github.event_name != 'schedule' }}
        run: python -m unittest discover -v
      - name: Descobrir versões sem aguardar os downloads
        id: discovery
        timeout-minutes: 8
        run: python -u scripts/sync_catalog.py --catalog-only
      - name: Publicar versões e resultado da consulta
        if: ${{ always() && (steps.discovery.outcome == 'success' || steps.discovery.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/publish_catalog.py

  mirrors:
    name: Preparar cópias para download
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      # A slow copy cannot hold up the next source-discovery job.
      group: sync-catalog-mirrors
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          # Fetch the catalog already persisted by discovery.
          ref: master
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          # Reaproveita os pacotes baixados; se o cache falhar, só instala do zero.
          cache: pip
      - name: Instalar dependências do portal
        run: python -m pip install -r requirements.txt
      - name: Baixar, publicar e confirmar cada espelho
        id: copies
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 35
        run: python -u scripts/sync_catalog.py --publish --mirror-only
      - name: Salvar cópias confirmadas
        if: ${{ always() && (steps.copies.outcome == 'success' || steps.copies.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/publish_catalog.py

  notify:
    name: Avisar falhas por issue
    needs: [discover, mirrors]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: sync-catalog-notify
      cancel-in-progress: false
    steps:
      - name: Abrir ou fechar o aviso de falha
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DISCOVER: ${{ needs.discover.result }}
          MIRRORS: ${{ needs.mirrors.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Atualizador automático do catálogo falhou"
          issue=$(gh issue list --state open --limit 100 --json number,title             --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ "$DISCOVER" = "failure" ] || [ "$MIRRORS" = "failure" ]; then
            body="Execução com falha: $RUN_URL (consulta: $DISCOVER, cópias: $MIRRORS)."
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "$title" --body "$body O aviso fecha sozinho quando uma execução completa funcionar."
            fi
          elif [ "$DISCOVER" = "success" ] && [ "$MIRRORS" = "success" ] && [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Atualizador voltou a funcionar: $RUN_URL"
          fi

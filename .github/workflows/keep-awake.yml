name: Manter o site acordado

on:
  schedule:
    # A cada 6 horas: o Streamlit Cloud hiberna o app depois de horas sem visita.
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar navegador sem tela
        run: |
          python -m pip install "playwright>=1.45,<2"
          python -m playwright install --with-deps chromium
      - name: Abrir o app e acordar se estiver dormindo
        env:
          DOWNLOAD_APP_URL: ${{ vars.DOWNLOAD_APP_URL || secrets.DOWNLOAD_APP_URL || 'https://downloadsistemas.streamlit.app/' }}
        run: python scripts/keep_awake.py

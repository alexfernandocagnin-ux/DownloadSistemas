name: Acordar portal periodicamente

on:
  schedule:
    # A cada 6 horas: o Streamlit Cloud hiberna o app depois de horas sem visita.
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wake-download-portal
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validar automação de despertar
        run: python -m unittest test_keep_awake -v
      - name: Instalar navegador sem tela
        timeout-minutes: 4
        run: |
          python -m pip install "playwright>=1.45,<2"
          python -m playwright install --with-deps chromium
      - name: Abrir o app e acordar se estiver dormindo
        timeout-minutes: 6
        env:
          DOWNLOAD_APP_URL: ${{ vars.DOWNLOAD_APP_URL || 'https://downloadsistemas.streamlit.app/' }}
        run: python -u scripts/keep_awake.py
